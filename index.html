<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de repaso - Laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C151D;
    --paper: #EBE7E0;
    --paper-edge: #BDB8AD;
    --ink: #0C151D;
    --muted-text: #28455D;
    --accent: #44749D;
    --accent-deep: #28455D;
    --correct: #56CBF9;
    --correct-bg: #DCF3FC;
    --correct-icon: #0C151D;
    --incorrect: #A3452F;
    --incorrect-bg: #F1DDD3;
    --title-color: #C6D4E1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.05), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.25), transparent 60%);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .app { width: 100%; max-width: 640px; }

  .app-header { text-align: center; margin-bottom: 26px; }
  .app-header .eyebrow {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(241,236,221,0.55);
  }
  .app-header h1 {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--title-color);
    margin: 6px 0 0;
  }

  .progress-track {
    display: flex;
    gap: 7px;
    justify-content: center;
    margin: 18px 0 28px;
    min-height: 9px;
  }
  .drop {
    width: 9px; height: 9px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(45deg);
    background: rgba(241,236,221,0.18);
  }
  .drop.filled { background: var(--accent); }
  .drop.current { background: var(--paper); }

  .card {
    position: relative;
    background: var(--paper);
    border-radius: 3px;
    padding: 34px 32px 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.4) inset;
    border: 1px solid var(--paper-edge);
  }

  /* ---- Menu screen (rack of samples) ---- */
  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .menu-item {
    text-align: left;
    border: 1.5px solid var(--paper-edge);
    background: rgba(255,255,255,0.4);
    border-radius: 3px;
    padding: 16px 16px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .menu-item:hover { border-color: var(--accent-deep); background: rgba(68,116,157,0.08); }
  .menu-item:active { transform: scale(0.99); }
  .menu-item .tag {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-deep);
    letter-spacing: 0.06em;
  }
  .menu-item .name {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin-top: 4px;
    line-height: 1.3;
  }
  .menu-item .sub {
    font-size: 12px;
    color: var(--muted-text);
    margin-top: 4px;
  }
  .menu-intro {
    font-size: 14px;
    color: var(--muted-text);
    text-align: center;
    margin-bottom: 20px;
  }

  .sample-tag {
    position: absolute;
    top: -13px;
    left: 28px;
    background: var(--accent);
    color: var(--paper);
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 5px 11px;
    border-radius: 2px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 11.5px;
    color: var(--muted-text);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 0 16px;
  }
  .back-link:hover { color: var(--accent-deep); }

  .question-text {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 20px;
    line-height: 1.45;
    font-weight: 600;
    margin: 10px 0 24px;
  }

  .question-image {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 3px;
    border: 1px solid var(--paper-edge);
    margin: 4px 0 20px;
  }

  .option-image {
    display: block;
    max-width: 160px;
    max-height: 110px;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 3px;
    border: 1px solid var(--paper-edge);
    background: #FFFFFF;
    margin-bottom: 8px;
  }

  .subitems {
    list-style: lower-roman;
    padding-left: 22px;
    margin: -6px 0 22px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }
  .subitems li { margin-bottom: 4px; }

  .subq-block {
    margin: 20px 0 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--paper-edge);
  }
  .subq-block:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 4px;
  }
  .subq-prompt {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
    color: var(--ink);
  }
  .sub-status {
    font-size: 12.5px;
    color: var(--muted-text);
    margin-top: 8px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    text-align: left;
    border: 1.5px solid var(--paper-edge);
    background: rgba(255,255,255,0.35);
    border-radius: 3px;
    padding: 13px 16px;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover:not(.locked) { border-color: var(--accent-deep); background: rgba(68,116,157,0.08); }
  .option:active:not(.locked) { transform: scale(0.995); }

  .option .letter {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-text);
    border: 1px solid var(--paper-edge);
    border-radius: 50%;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option.correct-answer { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct-answer .letter { background: var(--correct); border-color: var(--correct); color: var(--correct-icon); }
  .option.incorrect-answer { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.incorrect-answer .letter { background: var(--incorrect); border-color: var(--incorrect); color: white; }
  .option.locked { cursor: default; }
  .option.dimmed { opacity: 0.55; }

  .option.selected:not(.locked) { border-color: var(--accent-deep); background: rgba(68,116,157,0.14); }
  .option.selected:not(.locked) .letter { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--paper); }

  .option.missed { border-color: var(--correct); background: var(--correct-bg); opacity: 0.65; }
  .option.missed .letter { background: transparent; border-color: var(--correct); color: var(--correct-icon); }

  .confirm-btn {
    width: 100%;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--paper);
    background: var(--accent-deep);
    border: none;
    padding: 12px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 4px;
  }
  .confirm-btn:hover:not(:disabled) { background: var(--accent); }
  .confirm-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .explanation {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--muted-text);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed rgba(0,0,0,0.12);
    display: none;
  }
  .option.correct-answer .explanation,
  .option.incorrect-answer .explanation,
  .option.missed .explanation { display: block; }
  .option-body { flex: 1; min-width: 0; }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 26px;
  }

  .status-note { font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 11.5px; color: var(--muted-text); }

  .next-btn, .menu-btn {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--paper);
    background: var(--accent-deep);
    border: none;
    padding: 11px 22px;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.2s ease, background 0.15s ease;
  }
  .next-btn { opacity: 0; pointer-events: none; }
  .next-btn.visible { opacity: 1; pointer-events: auto; }
  .next-btn:hover, .menu-btn:hover { background: var(--accent); }

  .id-field { margin-bottom: 16px; }
  .id-field label {
    display: block;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted-text);
    margin-bottom: 6px;
  }
  .id-field input, .id-field select {
    width: 100%;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 15px;
    padding: 11px 13px;
    border: 1.5px solid var(--paper-edge);
    border-radius: 3px;
    background: rgba(255,255,255,0.5);
    color: var(--ink);
  }
  .id-field input:focus, .id-field select:focus { outline: none; border-color: var(--accent-deep); }
  .id-error {
    font-size: 12px;
    color: var(--incorrect);
    margin: -8px 0 14px;
    display: none;
  }
  .id-error.visible { display: block; }
  .continue-btn {
    width: 100%;
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--paper);
    background: var(--accent-deep);
    border: none;
    padding: 13px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 6px;
  }
  .continue-btn:hover { background: var(--accent); }

  .send-btn {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--paper);
    background: var(--accent-deep);
    border: none;
    padding: 11px 22px;
    border-radius: 3px;
    cursor: pointer;
  }
  .send-btn:hover { background: var(--accent); }
  .send-btn.sent { background: var(--muted-text); cursor: default; }
  .sent-note {
    font-size: 12px;
    color: var(--muted-text);
    margin-top: 10px;
  }

  .result-screen { text-align: center; }
  .result-screen .big {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: var(--accent-deep);
    margin: 4px 0;
  }
  .result-screen p { color: var(--muted-text); font-size: 14px; }
  .result-actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
  .menu-btn { background: transparent; border: 1.5px solid var(--accent-deep); color: var(--accent-deep); }
  .menu-btn:hover { background: rgba(68,116,157,0.1); }

  @media (max-width: 480px) {
    .menu-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="eyebrow">Repaso &middot; Laboratorio de Química Inorgánica</div>
    <h1 id="mainTitle">Antes de empezar</h1>
  </div>

  <div class="progress-track" id="progressTrack"></div>

  <div class="card" id="card"></div>
</div>

<script>
/* =====================================================================
   PARA AGREGAR/EDITAR PREGUNTAS DE CADA PRÁCTICA:
   Cada práctica (P1...P6) tiene su propio array "questions" dentro de
   quizSets. Copiá un bloque { ... } y modificá el texto para agregar
   una pregunta nueva a esa práctica.
   - "correct: true" en una o varias opciones.
   - "explanation" se muestra siempre, sea correcta o no la opción.

   PUNTAJE PARCIAL (opcional):
   Por defecto, una opción correcta vale 1 punto y una incorrecta vale 0.
   Si en una pregunta hay varias opciones correctas pero no querés que
   valgan lo mismo, agregá "points" a esa opción, por ejemplo:

     { text: "La mejor respuesta", correct: true, points: 1,
       explanation: "..." },
     { text: "También es válida, pero menos completa", correct: true, points: 0.5,
       explanation: "..." },
     { text: "Respuesta incorrecta", correct: false,
       explanation: "..." }

   El máximo de esa pregunta queda fijado por el "points" más alto entre
   sus opciones (en el ejemplo, 1). No hace falta poner "points" en todas
   las opciones: si no lo agregás, se usa el valor por defecto (1 si es
   correcta, 0 si no).

   SUBCATEGORÍAS (i, ii, iii) (opcional):
   Si la pregunta tiene afirmaciones numeradas, agregá "subitems":

     subitems: ["Primera afirmación", "Segunda afirmación", "Tercera afirmación"]

   Se muestran como lista con números romanos (i, ii, iii) entre la
   pregunta y las opciones. Las opciones después referencian esos
   números normalmente (ej: "Solo I y II", "I, II y III").

   IMÁGENES (opcional):
   Agregá "image" con la ruta del archivo:

     image: "imagenes/p1_montaje.png"

   Creá una carpeta "imagenes" al lado de este archivo .html y poné ahí
   las fotos/diagramas. El nombre en "image" tiene que coincidir exacto
   con el nombre del archivo (mayúsculas/minúsculas incluidas).

   IMÁGENES DENTRO DE CADA OPCIÓN (opcional):
   Si cada opción de respuesta es una imagen distinta (en vez de una sola
   imagen para toda la pregunta), agregá "image" dentro de cada opción:

     options: [
       { text: "Opción A", image: "imagenes/opcion_a.png", correct: true, explanation: "..." },
       { text: "Opción B", image: "imagenes/opcion_b.png", correct: false, explanation: "..." }
     ]

   Se puede combinar con "image" a nivel de pregunta si hace falta.

   PREGUNTAS AL AZAR (opcional):
   Si a una práctica le agregás "questionsPerAttempt: N" (al mismo nivel
   que "title" y "questions"), cada vez que alguien entra a esa práctica
   la app elige N preguntas al azar de todas las que tengas cargadas, en
   orden aleatorio. Por ejemplo:

     P1: {
       title: "...",
       subtitle: "...",
       questionsPerAttempt: 3,
       questions: [ ...podés tener 10 acá, elige 3 al azar... ]
     }

   Si no agregás este campo, se muestran todas las preguntas de esa
   práctica (igual en orden aleatorio cada vez).

   PREGUNTAS FIJAS DENTRO DEL SORTEO (opcional):
   Si querés que algunas preguntas aparezcan SIEMPRE (y que el azar solo
   se aplique al resto), agregales "fixed: true" a esas preguntas:

     { question: "Esta siempre aparece", fixed: true, options: [...] }

   Las que no tengan "fixed" forman el pool del que se sortean las que
   falten hasta llegar a "questionsPerAttempt". Por ejemplo, con
   questionsPerAttempt: 4 y 2 preguntas fijas, se sortean 2 más de entre
   las que queden sin marcar.

   PREGUNTAS DE SELECCIÓN MÚLTIPLE (varias opciones a la vez) (opcional):
   Si una pregunta tiene varias respuestas correctas independientes (no
   una sola "mejor" opción), agregale "multiSelect: true" y "maxPoints"
   con el puntaje máximo real de esa pregunta:

     {
       question: "...",
       multiSelect: true,
       maxPoints: 1,
       options: [
         { text: "...", correct: true, points: 0.34, explanation: "..." },
         { text: "...", correct: true, points: 0.33, explanation: "..." },
         { text: "...", correct: true, points: 0.33, explanation: "..." },
         { text: "...", correct: false, explanation: "..." }
       ]
     }

   El estudiante puede tocar varias opciones antes de confirmar con el
   botón "Confirmar respuesta". El puntaje final suma los puntos de las
   opciones correctas que marcó (sin pasarse de "maxPoints"), y las
   opciones correctas que NO marcó quedan resaltadas igual al confirmar,
   para que las vea y aprenda de la explicación.

   VARIANTES DE UNA MISMA PREGUNTA (mostrar solo una) (opcional):
   Si tenés dos (o más) versiones de la misma pregunta y querés que en
   cada intento aparezca SOLO UNA de ellas al azar (nunca las dos),
   usá "variants" en vez de escribir la pregunta directamente:

     {
       variants: [
         { question: "Versión original...", options: [...] },
         { question: "Versión alternativa...", options: [...] }
       ]
     }

   Cada vez que alguien entra a la práctica, se sortea cuál de las
   versiones del array "variants" se le muestra. "fixed" y
   "questionsPerAttempt" siguen funcionando igual sobre el resultado ya
   sorteado.

   PREGUNTAS CON SUBPREGUNTAS (i, ii, iii en una sola tarjeta) (opcional):
   Si una pregunta tiene varias partes (i, ii, iii...) que se responden
   TODAS JUNTAS en la misma pantalla y se corrigen con un solo botón de
   "Confirmar respuesta", usá "subquestions" en vez de "options":

     {
       question: "Texto introductorio general (opcional)",
       subquestions: [
         {
           prompt: "i) Primera parte",
           options: [
             { text: "...", correct: true, explanation: "..." },
             { text: "...", correct: false, explanation: "..." }
           ]
         },
         {
           prompt: "ii) Segunda parte",
           multiSelect: true,
           maxPoints: 1,
           options: [
             { text: "...", correct: true, points: 0.5, explanation: "..." },
             { text: "...", correct: true, points: 0.5, explanation: "..." },
             { text: "...", correct: false, explanation: "..." }
           ]
         }
       ]
     }

   Cada subpregunta funciona igual que una pregunta común (podés usar
   "points", "multiSelect" y "maxPoints" dentro de cada una, igual que en
   una pregunta normal). El puntaje de la tarjeta es la suma de lo que se
   gana en cada subpregunta. No se puede combinar "subquestions" con
   "options" en la misma pregunta: una pregunta usa una cosa o la otra.
===================================================================== */
/* =====================================================================
   CONEXIÓN CON GOOGLE APPS SCRIPT (para que los docentes vean los
   resultados, sin que el estudiante pueda editar el puntaje)
   Pegá acá la URL que termina en /exec que te dio Google al implementar
   el script como "Aplicación web".
===================================================================== */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzK48sRbZxGoJ2O_5mhgZLaDpEkE6sBZYS4rQspkfVqTlHvtJcLd-S6zx4HbGQGpxZj/exec";

let studentGroup = "";

let studentName = "";
let studentCedula = "";

const quizSets = {
  P1: {
    title: "P1 · Óxido de cobre(II)",
    subtitle: "Descomposición térmica de carbonato",
    questions: [
      {
        question: "¿Qué material consideras que sería adecuado para realizar la precipitación de carbonato básico de cobre?",
        options: [
          { text: "Vaso de Bohemia", correct: true, points: 0.5,
            explanation: "El tubo Falcon permite centrifugar directamente para separar el precipitado, sin trasvasar a otro recipiente. El vaso de Bohemia es el más utilizado para precipitar, pero requiere un paso extra de trasvase antes de separar el sólido, por lo que hay más pérdidas de rendimiento." },
          { text: "Tubo falcon", correct: true, points: 1,
            explanation: "El tubo Falcon permite centrifugar directamente para separar el precipitado, sin trasvasar a otro recipiente. El vaso de Bohemia es el más utilizado para precipitar, pero requiere un paso extra de trasvase antes de separar el sólido, por lo que hay más pérdidas de rendimiento." },
          { text: "Matraz Erlenmeyer", correct: false,
            explanation: "La forma del matraz Erlenmeyer dificulta retirar el sólido de su interior, por lo que se pierde mucho más sólido en ese trasvase hacia otro recipiente." },
          { text: "Tubo de ensayo", correct: false, explanation: "" }
        ]
      },
      {
        question: "¿Qué tipo de agitación consideras más adecuada para mezclar los reactivos íntimamente durante una reacción?",
        options: [
          { text: "a) Agitación circular, rotando el vaso con la mano", image: "imagenes/p1_agitacion_a.png", correct: false, explanation: "" },
          { text: "b) Agitación con varilla de vidrio", image: "imagenes/p1_agitacion_b.png", correct: true, explanation: "" }
        ]
      },
      {
        question: "¿Con cuál de los siguientes materiales realizarías un agregado \"gota a gota\"?",
        options: [
          { text: "Pipeta Pasteur", correct: true, points: 1,
            explanation: "La pipeta Pasteur permite controlar la velocidad de adición y regular el goteo, lo que permite obtener una relación de velocidades de nucleación y crecimiento adecuada para la obtención de cristales de buen tamaño." },
          { text: "Pipeta graduada", correct: false,
            explanation: "Las pipetas graduada y aforada están pensadas para medir volúmenes, no para controlar el goteo." },
          { text: "Pipeta aforada", correct: false,
            explanation: "Las pipetas graduada y aforada están pensadas para medir volúmenes, no para controlar el goteo." },
          { text: "De a poco, desde un vaso de Bohemia o matraz", correct: false,
            explanation: "Verter \"de a poco\" desde un vaso o matraz no da el mismo nivel de control que una pipeta Pasteur y puede conducir a un agregado muy rápido, que influye en el tamaño del precipitado obtenido al final." }
        ]
      },
      {
        question: "En relación a la medida de líquidos, indicá qué materiales considerás adecuados para medir volumen en cada situación (podés marcar más de una opción por parte):",
        subquestions: [
          {
            prompt: "i) Soluciones o líquidos para usar como reactivo de síntesis",
            multiSelect: true,
            maxPoints: 1,

let maxScore = 0;
const letters = ["A","B","C","D","E","F"];

const card = document.getElementById("card");
const progressTrack = document.getElementById("progressTrack");
const mainTitle = document.getElementById("mainTitle");

function renderIdScreen() {
  mainTitle.textContent = "Antes de empezar";
  progressTrack.innerHTML = "";
  card.innerHTML = `
    <div class="menu-intro">Estos datos se usan solo para identificar tu entrega ante los profesores.</div>
    <div class="id-field">
      <label>Nombre y apellido</label>
      <input type="text" id="nameInput" placeholder="Ej: Juan Pérez" value="${studentName}">
    </div>
    <div class="id-field">
      <label>Cédula</label>
      <input type="text" id="cedulaInput" placeholder="Ej: 12345678" value="${studentCedula}">
    </div>
    <div class="id-field">
      <label>Grupo</label>
      <select id="groupInput">
        <option value="" disabled ${!studentGroup ? "selected" : ""}>Seleccioná tu grupo</option>
        ${Array.from({length: 10}, (_, i) => `G${i+1}`).map(g =>
          `<option value="${g}" ${studentGroup === g ? "selected" : ""}>${g}</option>`
        ).join("")}
      </select>
    </div>
    <div class="id-error" id="idError">Completá todos los campos para continuar.</div>
    <button class="continue-btn" id="continueBtn">Continuar</button>
  `;
  document.getElementById("continueBtn").addEventListener("click", () => {
    const name = document.getElementById("nameInput").value.trim();
    const cedulaRaw = document.getElementById("cedulaInput").value.trim();
    const cedula = cedulaRaw.replace(/[^0-9]/g, ""); // deja solo dígitos: quita puntos, guiones, espacios
    const group = document.getElementById("groupInput").value;
    if (!name || !cedula || !group) {
      document.getElementById("idError").classList.add("visible");
      return;
    }
    studentName = name;
    studentCedula = cedula;
    studentGroup = group;
    renderMenu();
  });
}

function renderMenu() {
  activeSetKey = null;
  mainTitle.textContent = "Elige una práctica";
  progressTrack.innerHTML = "";
  card.innerHTML = `
    <button class="back-link" id="changeIdLink">&larr; cambiar nombre / cédula / grupo</button>
    <div class="menu-intro">Selecciona el cuestionario que quieres realizar.</div>
    <div class="menu-grid" id="menuGrid"></div>
  `;
  document.getElementById("changeIdLink").addEventListener("click", renderIdScreen);
  const grid = document.getElementById("menuGrid");
  Object.keys(quizSets).forEach(key => {
    const set = quizSets[key];
    const btn = document.createElement("button");
    btn.className = "menu-item";
    btn.innerHTML = `
      <div class="tag">${key}</div>
      <div class="name">${set.title.replace(key + " · ", "")}</div>
      <div class="sub">${set.subtitle}</div>
    `;
    btn.addEventListener("click", () => startSet(key));
    grid.appendChild(btn);
  });
}

async function sendResult(practiceKey, scoreText) {
  const payload = {
    nombre: studentName,
    cedula: studentCedula,
    grupo: studentGroup,
    practica: practiceKey,
    puntaje: scoreText
  };
  // mode "no-cors" evita el chequeo de permisos cruzados del navegador;
  // a cambio, no podemos leer la respuesta — por eso se asume éxito si
  // el fetch no tira un error de red.
  await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(payload)
  });
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function resolveVariants(rawQuestions) {
  // Si una entrada tiene "variants" (varias versiones de la misma pregunta,
  // ej. "original" y "alternativa"), se elige UNA al azar por intento, en
  // vez de mostrar todas.
  return rawQuestions.map(q => {
    if (q.variants) {
      return q.variants[Math.floor(Math.random() * q.variants.length)];
    }
    return q;
  });
}

function startSet(key) {
  activeSetKey = key;
  current = 0;
  score = 0;
  maxScore = 0;
  const set = quizSets[key];
  const n = set.questionsPerAttempt;
  const resolvedQuestions = resolveVariants(set.questions);

  if (typeof n === "number" && n < resolvedQuestions.length) {
    const fixedQs = resolvedQuestions.filter(q => q.fixed);
    const poolQs = resolvedQuestions.filter(q => !q.fixed);
    const remaining = Math.max(n - fixedQs.length, 0);
    const randomPart = shuffleArray(poolQs).slice(0, remaining);
    activeQuestions = shuffleArray(fixedQs.concat(randomPart));
  } else {
    activeQuestions = shuffleArray(resolvedQuestions);
  }

  mainTitle.textContent = set.title;
  renderQuestion();
}

function getOptionPoints(opt) {
  if (typeof opt.points === "number") return opt.points;
  return opt.correct ? 1 : 0;
}

function getQuestionMaxPoints(q) {
  return Math.max(...q.options.map(getOptionPoints));
}

function resolveMaxPoints(q) {
  // Para preguntas de selección múltiple con "maxPoints" definido, se usa
  // ese valor como tope (así elegir varias opciones correctas a la vez no
  // suma más allá del máximo real de la pregunta).
  if (typeof q.maxPoints === "number") return q.maxPoints;
  return getQuestionMaxPoints(q);
}

function formatNum(n) {
  if (Number.isInteger(n)) return n.toString();
  return parseFloat(n.toFixed(2)).toString();
}

function renderProgress() {
  const total = activeQuestions.length;
  progressTrack.innerHTML = "";
  for (let i = 0; i < total; i++) {
    const d = document.createElement("div");
    d.className = "drop" + (i < current ? " filled" : "") + (i === current ? " current" : "");
    progressTrack.appendChild(d);
  }
}

function renderQuestion() {
  const q = activeQuestions[current];

  if (q.subquestions) {
    renderSubquestionsCard(q);
    return;
  }

  currentOptions = shuffleArray(q.options);
  selectedIndices = new Set();
  const tagNum = String(current + 1).padStart(2, "0");

  const imageHtml = q.image
    ? `<img src="${q.image}" alt="Imagen de la pregunta" class="question-image">`
    : "";
  const subitemsHtml = q.subitems
    ? `<ol class="subitems">${q.subitems.map(s => `<li>${s}</li>`).join("")}</ol>`
    : "";
  const confirmHtml = q.multiSelect
    ? `<button class="confirm-btn" id="confirmBtn" disabled>Confirmar respuesta</button>`
    : "";

  card.innerHTML = `
    <button class="back-link" id="backLink">&larr; volver al menú</button>
    <div class="sample-tag">MUESTRA Nº ${tagNum}</div>
    <div class="question-text">${q.question}</div>
    ${imageHtml}
    ${subitemsHtml}
    <div class="options" id="optionsWrap"></div>
    ${confirmHtml}
    <div class="footer-row">
      <div class="status-note" id="statusNote">${q.multiSelect ? "Marcá una o más opciones y confirmá" : "Seleccioná una opción"}</div>
      <button class="next-btn" id="nextBtn">
        ${current === activeQuestions.length - 1 ? "Ver resultado" : "Siguiente pregunta"}
      </button>
    </div>
  `;

  const wrap = document.getElementById("optionsWrap");
  currentOptions.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    const optionImageHtml = opt.image
      ? `<img src="${opt.image}" alt="${opt.text || "Imagen de la opción"}" class="option-image">`
      : "";
    btn.innerHTML = `
      <span class="letter">${letters[i]}</span>
      <span class="option-body">
        ${optionImageHtml}
        <span class="option-text">${opt.text}</span>
        <div class="explanation">${opt.explanation}</div>
      </span>
    `;
    if (q.multiSelect) {
      btn.addEventListener("click", () => toggleOption(i));
    } else {
      btn.addEventListener("click", () => selectOption(i));
    }
    wrap.appendChild(btn);
  });

  if (q.multiSelect) {
    document.getElementById("confirmBtn").addEventListener("click", confirmMultiSelect);
  }
  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("backLink").addEventListener("click", renderMenu);
  renderProgress();
}

function toggleOption(index) {
  const optionButtons = document.querySelectorAll("#optionsWrap .option");
  if (optionButtons[0].classList.contains("locked")) return;

  const btn = optionButtons[index];
  if (selectedIndices.has(index)) {
    selectedIndices.delete(index);
    btn.classList.remove("selected");
  } else {
    selectedIndices.add(index);
    btn.classList.add("selected");
  }
  document.getElementById("confirmBtn").disabled = selectedIndices.size === 0;
}

function confirmMultiSelect() {
  const q = activeQuestions[current];
  const optionButtons = document.querySelectorAll("#optionsWrap .option");
  const maxP = resolveMaxPoints(q);
  let earned = 0;

  optionButtons.forEach((btn, i) => {
    btn.classList.add("locked");
    btn.classList.remove("selected");
    const opt = currentOptions[i];
    const isSelected = selectedIndices.has(i);
    const letterEl = btn.querySelector(".letter");

    if (isSelected && opt.correct) {
      btn.classList.add("correct-answer");
      letterEl.textContent = "✓";
      earned += getOptionPoints(opt);
    } else if (isSelected && !opt.correct) {
      btn.classList.add("incorrect-answer");
      letterEl.textContent = "✗";
    } else if (!isSelected && opt.correct) {
      btn.classList.add("missed");
      letterEl.textContent = "✓";
    } else {
      btn.classList.add("dimmed");
    }
  });

  earned = Math.min(earned, maxP);
  score += earned;
  maxScore += maxP;

  let message;
  if (earned >= maxP && earned > 0) {
    message = "¡Correcto! Revisá las explicaciones abajo.";
  } else if (earned > 0) {
    message = `Parcialmente correcto (vale ${formatNum(earned)} de ${formatNum(maxP)} puntos) — mirá las explicaciones.`;
  } else {
    message = "Ninguna de las marcadas era correcta — mirá las explicaciones abajo.";
  }
  document.getElementById("statusNote").textContent = message;
  document.getElementById("confirmBtn").style.display = "none";
  document.getElementById("nextBtn").classList.add("visible");
}

/* =====================================================================
   PREGUNTAS CON SUBPREGUNTAS (i, ii, iii... en una sola tarjeta)
===================================================================== */
let subOptionsShuffled = [];
let subSelections = [];

function renderSubquestionsCard(q) {
  subOptionsShuffled = q.subquestions.map(sq => shuffleArray(sq.options));
  subSelections = q.subquestions.map(sq => sq.multiSelect ? new Set() : null);
  const tagNum = String(current + 1).padStart(2, "0");

  const imageHtml = q.image
    ? `<img src="${q.image}" alt="Imagen de la pregunta" class="question-image">`
    : "";
  const introHtml = q.question ? `<div class="question-text">${q.question}</div>` : "";

  const blocksHtml = q.subquestions.map((sq, si) => `
    <div class="subq-block">
      <div class="subq-prompt">${sq.prompt}</div>
      <div class="options" id="subOptions${si}"></div>
      <div class="sub-status" id="subStatus${si}" style="display:none;"></div>
    </div>
  `).join("");

  card.innerHTML = `
    <button class="back-link" id="backLink">&larr; volver al menú</button>
    <div class="sample-tag">MUESTRA Nº ${tagNum}</div>
    ${introHtml}
    ${imageHtml}
    ${blocksHtml}
    <button class="confirm-btn" id="confirmAllBtn" disabled>Confirmar respuesta</button>
    <div class="footer-row">
      <div class="status-note" id="statusNote"></div>
      <button class="next-btn" id="nextBtn">
        ${current === activeQuestions.length - 1 ? "Ver resultado" : "Siguiente pregunta"}
      </button>
    </div>
  `;

  q.subquestions.forEach((sq, si) => {
    const wrap = document.getElementById(`subOptions${si}`);
    subOptionsShuffled[si].forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      const optionImageHtml = opt.image
        ? `<img src="${opt.image}" alt="${opt.text || "Imagen de la opción"}" class="option-image">`
        : "";
      btn.innerHTML = `
        <span class="letter">${letters[i]}</span>
        <span class="option-body">
          ${optionImageHtml}
          <span class="option-text">${opt.text}</span>
          <div class="explanation">${opt.explanation}</div>
        </span>
      `;
      btn.addEventListener("click", () => toggleSubOption(si, i, !!sq.multiSelect));
      wrap.appendChild(btn);
    });
  });

  document.getElementById("confirmAllBtn").addEventListener("click", () => confirmSubquestions(q));
  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("backLink").addEventListener("click", renderMenu);
  renderProgress();
}

function toggleSubOption(si, i, isMulti) {
  const wrap = document.getElementById(`subOptions${si}`);
  if (wrap.classList.contains("locked")) return;
  const btns = wrap.querySelectorAll(".option");

  if (isMulti) {
    if (subSelections[si].has(i)) {
      subSelections[si].delete(i);
      btns[i].classList.remove("selected");
    } else {
      subSelections[si].add(i);
      btns[i].classList.add("selected");
    }
  } else {
    subSelections[si] = i;
    btns.forEach((b, bi) => b.classList.toggle("selected", bi === i));
  }
  updateConfirmAllState();
}

function updateConfirmAllState() {
  const allAnswered = subSelections.every(sel =>
    sel instanceof Set ? sel.size > 0 : sel !== null
  );
  document.getElementById("confirmAllBtn").disabled = !allAnswered;
}

function confirmSubquestions(q) {
  let totalEarned = 0;
  let totalMax = 0;

  q.subquestions.forEach((sq, si) => {
    const wrap = document.getElementById(`subOptions${si}`);
    wrap.classList.add("locked");
    const btns = wrap.querySelectorAll(".option");
    const maxP = resolveMaxPoints(sq);
    const sel = subSelections[si];
    const isMulti = !!sq.multiSelect;
    let earned = 0;

    btns.forEach((btn, i) => {
      btn.classList.add("locked");
      const opt = subOptionsShuffled[si][i];
      const letterEl = btn.querySelector(".letter");
      const isSelected = isMulti ? sel.has(i) : sel === i;

      if (isSelected && opt.correct) {
        btn.classList.add("correct-answer");
        letterEl.textContent = "✓";
        earned += getOptionPoints(opt);
      } else if (isSelected && !opt.correct) {
        btn.classList.add("incorrect-answer");
        letterEl.textContent = "✗";
      } else if (!isSelected && opt.correct) {
        btn.classList.add("missed");
        letterEl.textContent = "✓";
      } else {
        btn.classList.add("dimmed");
      }
    });

    earned = Math.min(earned, maxP);
    totalEarned += earned;
    totalMax += maxP;

    const statusEl = document.getElementById(`subStatus${si}`);
    statusEl.style.display = "block";
    if (earned >= maxP && earned > 0) {
      statusEl.textContent = "¡Correcto!";
    } else if (earned > 0) {
      statusEl.textContent = `Parcialmente correcto (${formatNum(earned)} de ${formatNum(maxP)} puntos)`;
    } else {
      statusEl.textContent = "Incorrecto — revisá las explicaciones.";
    }
  });

  score += totalEarned;
  maxScore += totalMax;

  document.getElementById("statusNote").textContent =
    `Puntaje de esta pregunta: ${formatNum(totalEarned)} / ${formatNum(totalMax)}`;
  document.getElementById("confirmAllBtn").style.display = "none";
  document.getElementById("nextBtn").classList.add("visible");
}

function selectOption(index) {
  const q = activeQuestions[current];
  const optionButtons = document.querySelectorAll("#optionsWrap .option");
  if (optionButtons[0].classList.contains("locked")) return;

  const chosenOpt = currentOptions[index];
  const earned = getOptionPoints(chosenOpt);
  const maxP = resolveMaxPoints(q);

  optionButtons.forEach((btn, i) => {
    btn.classList.add("locked");
    const isCorrect = currentOptions[i].correct;
    const letterEl = btn.querySelector(".letter");
    if (isCorrect) {
      btn.classList.add("correct-answer");
      letterEl.textContent = "✓";
    } else if (i === index) {
      btn.classList.add("incorrect-answer");
      letterEl.textContent = "✗";
    } else {
      btn.classList.add("dimmed");
    }
  });

  score += earned;
  maxScore += maxP;

  let message;
  if (earned >= maxP && earned > 0) {
    message = "¡Correcto! Revisá las explicaciones abajo.";
  } else if (earned > 0) {
    message = `Parcialmente correcto (vale ${formatNum(earned)} de ${formatNum(maxP)} puntos) — mirá las explicaciones.`;
  } else {
    message = "No era esa — mirá las explicaciones para entender por qué.";
  }
  document.getElementById("statusNote").textContent = message;
  document.getElementById("nextBtn").classList.add("visible");
}

function goNext() {
  if (current < activeQuestions.length - 1) {
    current++;
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  current = activeQuestions.length;
  renderProgress();
  const pct = maxScore > 0 ? Math.round((score / maxScore) * 100) : 0;
  const scoreText = `${formatNum(score)}/${formatNum(maxScore)}`;
  card.innerHTML = `
    <div class="result-screen">
      <div class="status-note" style="margin-bottom:2px;">RESULTADO · ${activeSetKey}</div>
      <div class="big">${formatNum(score)} / ${formatNum(maxScore)}</div>
      <p>${pct}% de respuestas correctas en esta ronda.</p>
      <button class="send-btn" id="sendBtn">Enviar resultado</button>
      <div class="sent-note" id="sentNote"></div>
      <div class="result-actions" style="margin-top:16px;">
        <button class="menu-btn" id="menuBtn">Volver al menú</button>
      </div>
    </div>
  `;
  document.getElementById("sendBtn").addEventListener("click", async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = "Enviando...";
    document.getElementById("sentNote").textContent = "";
    try {
      await sendResult(activeSetKey, scoreText);
      btn.textContent = "Enviado ✓";
      btn.classList.add("sent");
      document.getElementById("sentNote").textContent = "Resultado enviado.";
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Enviar resultado";
      document.getElementById("sentNote").textContent = "No se pudo enviar (revisá tu conexión) — probá de nuevo.";
    }
  });
  document.getElementById("menuBtn").addEventListener("click", renderMenu);
}

renderIdScreen();
</script>
